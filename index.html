<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ EV 충전기 통합 관리 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --blue:#1a73e8; --green:#34a853; --yellow:#fbbc04;
  --red:#ea4335; --orange:#f57c00; --gray:#5f6368;
  --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
  --text:#1e293b; --text2:#64748b;
  --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

.header{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff;
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.3);}
.header h1{font-size:1.4rem;font-weight:700;}
.header-meta{font-size:.78rem;color:#a0b4c8;}

.container{max-width:1400px;margin:0 auto;padding:16px;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);border-left:4px solid var(--blue);}
.kpi-card.green{border-left-color:var(--green);}
.kpi-card.yellow{border-left-color:var(--yellow);}
.kpi-card.red{border-left-color:var(--red);}
.kpi-card.orange{border-left-color:var(--orange);}
.kpi-label{font-size:.75rem;color:var(--text2);font-weight:600;margin-bottom:4px;}
.kpi-value{font-size:1.6rem;font-weight:800;color:var(--blue);}
.kpi-card.green .kpi-value{color:var(--green);}
.kpi-card.yellow .kpi-value{color:#d97706;}
.kpi-card.red .kpi-value{color:var(--red);}
.kpi-card.orange .kpi-value{color:var(--orange);}
.kpi-unit{font-size:.72rem;color:var(--text2);}

/* 탭 */
.tabs{display:flex;gap:4px;background:var(--card);padding:6px;
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:8px 16px;border:none;background:none;border-radius:8px;
  font-size:.88rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;}
.tab-btn:hover{background:#f1f5f9;color:var(--text);}
.tab-btn.active{background:var(--blue);color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* 토글 */
.toggle-bar{display:flex;align-items:center;gap:16px;margin-bottom:16px;
  background:var(--card);padding:10px 16px;border-radius:var(--radius);
  box-shadow:var(--shadow);flex-wrap:wrap;}
.toggle-switch{position:relative;width:48px;height:24px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;
  transition:.2s;cursor:pointer;}
.toggle-slider::before{content:"";position:absolute;height:18px;width:18px;
  left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle-switch input:checked+.toggle-slider{background:var(--blue);}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(24px);}

/* 검색 */
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.search-bar input,.search-bar select{padding:9px 14px;
  border:2px solid var(--border);border-radius:8px;font-size:.88rem;outline:none;}
.search-bar input:focus,.search-bar select:focus{border-color:var(--blue);}
.search-bar input{flex:1;min-width:180px;}
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-secondary{background:#f1f5f9;color:var(--text);}

/* 사이트 카드 그리드 */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;margin-bottom:20px;}
.site-card{background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:transform .15s;}
.site-card:hover{transform:translateY(-2px);}
.site-card-header{padding:14px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);}
.site-card-header:hover{background:#f8fafc;}
.site-name{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.site-addr{font-size:.78rem;color:var(--text2);margin-bottom:6px;}
.site-stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.site-stat{font-size:.8rem;}
.site-stat b{color:var(--blue);}
.site-chargers{display:none;padding:0 16px 14px;}
.site-chargers.open{display:block;}
.site-chargers-title{font-size:.82rem;font-weight:700;
  color:var(--text2);padding:10px 0 6px;border-top:1px solid var(--border);}

/* 테이블 */
.table-wrap{background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;}
.table-header{padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--border);}
.table-header h3{font-size:.95rem;font-weight:700;}
.table-container{overflow-x:auto;max-height:500px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
thead th{background:#f8fafc;padding:9px 10px;text-align:left;font-weight:700;
  border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1;
  white-space:nowrap;cursor:pointer;}
thead th:hover{background:#e2e8f0;}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:8px 10px;white-space:nowrap;}

.badge{display:inline-block;padding:2px 7px;border-radius:10px;
  font-size:.72rem;font-weight:600;}
.badge-red{background:#fef2f2;color:#dc2626;}
.badge-orange{background:#fff7ed;color:#c2410c;}
.badge-yellow{background:#fefce8;color:#b45309;}
.badge-green{background:#f0fdf4;color:#16a34a;}
.badge-gray{background:#f8fafc;color:#64748b;}
.badge-blue{background:#eff6ff;color:#2563eb;}

/* 차트 */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:14px;margin-bottom:20px;}
.chart-card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);}
.chart-card h3{font-size:.88rem;font-weight:700;margin-bottom:12px;}
.chart-wrap{position:relative;height:260px;}

/* 페이지네이션 */
.pagination{display:flex;align-items:center;gap:4px;padding:10px 16px;
  justify-content:center;flex-wrap:wrap;}
.page-btn{min-width:30px;height:30px;border:1px solid var(--border);
  background:var(--card);color:var(--text);border-radius:6px;
  font-size:.8rem;font-weight:600;cursor:pointer;}
.page-btn:hover{border-color:var(--blue);color:var(--blue);}
.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* 로딩 */
.loading{text-align:center;padding:60px 20px;color:var(--text2);}
.spinner{width:36px;height:36px;border:4px solid #e2e8f0;
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);
  padding:20px;color:#dc2626;text-align:center;}

/* 히트맵 */
.heatmap-wrap{overflow-x:auto;}
.heatmap-table{border-collapse:collapse;font-size:.76rem;min-width:600px;}
.heatmap-table th,.heatmap-table td{padding:6px 9px;border:1px solid #e2e8f0;
  text-align:center;white-space:nowrap;}
.heatmap-table th{background:#f8fafc;font-weight:700;}

@media(max-width:640px){
  .container{padding:10px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .site-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚡ EV 충전기 통합 관리 대시보드</h1>
    <div class="header-meta" id="header-meta">데이터 로딩 중...</div>
  </div>
  <div id="date-diff-badge" style="font-size:.82rem;background:rgba(255,255,255,.15);
    padding:5px 12px;border-radius:8px;color:#e8f4fd;"></div>
</div>

<div class="container">
  <div id="loading-area" class="loading">
    <div class="spinner"></div><p>데이터를 불러오는 중입니다...</p>
  </div>

  <div id="dashboard" style="display:none;">

    <!-- KPI -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- 토글 -->
    <div class="toggle-bar">
      <span style="font-size:.88rem;font-weight:700;">⚡ 사용량 기준:</span>
      <span id="lbl-full" style="color:var(--blue);font-weight:700;font-size:.85rem;">전체기간 월평균</span>
      <label class="toggle-switch">
        <input type="checkbox" id="usage-toggle" onchange="onUsageToggle()">
        <span class="toggle-slider"></span>
      </label>
      <span id="lbl-recent" style="color:var(--text2);font-size:.85rem;">최신 1개월</span>
      <span id="toggle-desc" style="font-size:.78rem;color:var(--text2);margin-left:4px;"></span>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-overview',this)">📊 전체 현황</button>
      <button class="tab-btn" onclick="switchTab('tab-site',this)">🏢 사이트별</button>
      <button class="tab-btn" onclick="switchTab('tab-charger',this)">🔌 충전기별</button>
      <button class="tab-btn" onclick="switchTab('tab-model',this)">📦 모델별</button>
      <button class="tab-btn" onclick="switchTab('tab-region',this)">🗺️ 권역별</button>
    </div>

    <!-- 전체 현황 탭 -->
    <div id="tab-overview" class="tab-panel active">
      <div class="chart-grid">
        <div class="chart-card">
          <h3>📊 모델별 충전기 수량 (상위 15)</h3>
          <div class="chart-wrap"><canvas id="chart-model-count"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>🗺️ 권역별 충전기 수량</h3>
          <div class="chart-wrap"><canvas id="chart-region-count"></canvas></div>
        </div>
        <div class="chart-card">
          <h3 id="chart-model-usage-title">📈 모델별 월사용량 (상위 15)</h3>
          <div class="chart-wrap"><canvas id="chart-model-usage"></canvas></div>
        </div>
        <div class="chart-card">
          <h3 id="chart-region-usage-title">🗺️ 권역별 월사용량</h3>
          <div class="chart-wrap"><canvas id="chart-region-usage"></canvas></div>
        </div>
      </div>
      <div class="chart-card">
        <h3 id="heatmap-title">🔥 권역 × 모델 사용량 히트맵</h3>
        <div class="heatmap-wrap" id="heatmap-container"></div>
      </div>
    </div>

    <!-- 사이트별 탭 -->
    <div id="tab-site" class="tab-panel">
    
      <!-- 검색바 -->
      <div class="search-bar">
        <input type="text" id="site-search"
          placeholder="사이트명 또는 주소 검색..." oninput="onSiteSearch()">
        <select id="site-region-filter" onchange="onSiteSearch()"
          style="min-width:120px;">
          <option value="">전체 권역</option>
        </select>
        <select id="site-contract-filter" onchange="onSiteSearch()"
          style="min-width:120px;">
          <option value="">전체 계약상태</option>
          <option value="계약만료">🔴 계약만료</option>
          <option value="만료임박">🟠 만료임박</option>
          <option value="만료예정">🟡 만료예정</option>
          <option value="정상운영">🟢 정상운영</option>
          <option value="정보없음">⚪ 정보없음</option>
        </select>
        <button class="btn btn-secondary" onclick="clearSiteFilter()">✕ 초기화</button>
      </div>
    
      <div id="site-count-info"
        style="font-size:.85rem;color:var(--text2);margin-bottom:10px;"></div>
    
      <!-- ① 사이트별 집계 테이블 -->
      <div id="site-table-wrap"></div>
    
      <!-- ② 충전기별 목록 -->
      <div id="site-charger-wrap" style="margin-top:20px;"></div>
    
      <!-- ③ 계약 현황 카드 -->
      <div id="site-contract-wrap" style="margin-top:20px;"></div>
    
    </div>


    <!-- 충전기별 탭 -->
    <div id="tab-charger" class="tab-panel">
      <div class="search-bar">
        <input type="text" id="charger-search" placeholder="충전기ID, 충전소명, 주소 검색..."
          oninput="onChargerSearch()">
        <select id="charger-model-filter" onchange="onChargerSearch()"
          style="min-width:120px;">
          <option value="">전체 모델</option>
        </select>
        <button class="btn btn-secondary" onclick="clearChargerFilter()">✕ 초기화</button>
        <button class="btn btn-secondary" onclick="downloadCSV('charger')"
          style="font-size:.8rem;">💾 CSV</button>
      </div>
      <div class="table-wrap">
        <div class="table-header">
          <h3>🔌 충전기별 현황</h3>
          <span id="charger-count-badge" class="badge badge-blue"></span>
        </div>
        <div class="table-container">
          <table>
            <thead><tr id="charger-thead"></tr></thead>
            <tbody id="charger-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="charger-pagination"></div>
      </div>
    </div>

    <!-- 모델별 탭 -->
    <div id="tab-model" class="tab-panel">
      <div class="table-wrap">
        <div class="table-header">
          <h3>📦 모델별 집계</h3>
          <button class="btn btn-secondary" onclick="downloadCSV('model')"
            style="font-size:.8rem;">💾 CSV</button>
        </div>
        <div class="table-container">
          <table>
            <thead><tr id="model-thead"></tr></thead>
            <tbody id="model-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 권역별 탭 -->
    <div id="tab-region" class="tab-panel">
      <div class="chart-grid" id="region-charts"></div>
      <div class="table-wrap">
        <div class="table-header">
          <h3>🗺️ 권역별 집계</h3>
          <button class="btn btn-secondary" onclick="downloadCSV('region')"
            style="font-size:.8rem;">💾 CSV</button>
        </div>
        <div class="table-container">
          <table>
            <thead><tr id="region-thead"></tr></thead>
            <tbody id="region-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════
// 전역 상태
// ═══════════════════════════════════════
let G = {
  data: null,
  useRecent: false,
  charger: { filtered:[], page:1, perPage:50, sortCol:'월사용량_전체', sortDir:-1 },
  site:    { filtered:[], page:1, perPage:12 },
  charts:  {},
};

const REGION_ORDER = [
  '수도권북동','수도권북서','수도권남동','수도권남서',
  '수도권기타','인천기타','강원권','충청권','전라권','경상권','제주권','기타'
];

const fmt  = (v,d=0) => v==null?"-":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = v => v==null?"-":(v>=1000?fmt(v,0):fmt(v,1));

// ═══════════════════════════════════════
// 데이터 로드
// ═══════════════════════════════════════
async function loadData() {
  try {
    const ts  = Math.floor(Date.now()/3_600_000);
    const res = await fetch(`data/processed.json?t=${ts}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    G.data = await res.json();
    initDashboard();
  } catch(e) {
    document.getElementById("loading-area").innerHTML =
      `<div class="error-box"><b>❌ 데이터 로드 실패</b><br>${e.message}<br>
      <small>data/processed.json 파일이 존재하는지 확인하세요.</small></div>`;
  }
}

function initDashboard() {
  const m = G.data.meta;
  document.getElementById("loading-area").style.display = "none";
  document.getElementById("dashboard").style.display    = "block";
  document.getElementById("header-meta").textContent =
    `기초: ${m.base_date}  |  최신: ${m.daily_date}  |  생성: ${m.generated_at}`;
  document.getElementById("date-diff-badge").textContent =
    `📅 측정기간: ${m.diff_days}일`;

  updateToggleDesc();
  renderKPI();
  renderCharts();
  buildHeatmap();
  buildFilters();

  G.charger.filtered = [...G.data.chargers];
  G.site.filtered    = [...G.data.sites];
  renderSitePage();
  renderChargerTable();
  renderModelTable();
  renderRegionTable();
}

// ═══════════════════════════════════════
// 토글
// ═══════════════════════════════════════
function onUsageToggle() {
  G.useRecent = document.getElementById("usage-toggle").checked;
  document.getElementById("lbl-full").style.color    = G.useRecent?"var(--text2)":"var(--blue)";
  document.getElementById("lbl-recent").style.color  = G.useRecent?"var(--blue)":"var(--text2)";
  document.getElementById("lbl-full").style.fontWeight   = G.useRecent?"400":"700";
  document.getElementById("lbl-recent").style.fontWeight = G.useRecent?"700":"400";
  updateToggleDesc();
  renderKPI(); renderCharts(); buildHeatmap();
  renderSitePage(); renderChargerTable();
  renderModelTable(); renderRegionTable();
}
function updateToggleDesc() {
  const m = G.data?.meta;
  document.getElementById("toggle-desc").textContent = G.useRecent
    ? `(${m?.base_date} ~ ${m?.daily_date}, ${m?.diff_days}일 기준)`
    : "(운영계약 시작일 ~ 현재)";
}
function usageKey()    { return G.useRecent?"월사용량_최신합":"월사용량_전체합"; }
function usageAvgKey() { return G.useRecent?"월사용량_최신평균":"월사용량_전체평균"; }
function chargerUK()   { return G.useRecent?"월사용량_최신":"월사용량_전체"; }

// ═══════════════════════════════════════
// KPI
// ═══════════════════════════════════════
function renderKPI() {
  const c   = G.data.chargers;
  const uk  = chargerUK();
  const tot = c.reduce((s,r)=>s+(r[uk]||0),0);
  const avg = tot/c.length;
  const exp = c.filter(r=>r.계약상태==="계약만료").length;
  const lbl = G.useRecent?"최신1개월":"전체기간";

  document.getElementById("kpi-grid").innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">🔌 총 충전기</div>
      <div class="kpi-value">${fmt(c.length)}</div>
      <div class="kpi-unit">대</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">🏢 총 사이트</div>
      <div class="kpi-value">${fmt(G.data.meta.total_sites)}</div>
      <div class="kpi-unit">개</div>
    </div>
    <div class="kpi-card yellow">
      <div class="kpi-label">⚡ 월충전량 합계 [${lbl}]</div>
      <div class="kpi-value">${fmtK(tot)}</div>
      <div class="kpi-unit">kWh/월</div>
    </div>
    <div class="kpi-card orange">
      <div class="kpi-label">📊 충전기당 월평균 [${lbl}]</div>
      <div class="kpi-value">${fmtK(avg)}</div>
      <div class="kpi-unit">kWh/월</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-label">🔴 계약 만료</div>
      <div class="kpi-value">${fmt(exp)}</div>
      <div class="kpi-unit">대</div>
    </div>`;
}

// ═══════════════════════════════════════
// 필터 구성
// ═══════════════════════════════════════
function buildFilters() {
  const regions = [...new Set(G.data.chargers.map(c=>c.권역).filter(Boolean))]
    .sort((a,b)=>REGION_ORDER.indexOf(a)-REGION_ORDER.indexOf(b));
  const ropts = regions.map(r=>`<option value="${r}">${r}</option>`).join("");
  document.getElementById("site-region-filter").innerHTML =
    `<option value="">전체 권역</option>${ropts}`;

  const models = [...new Set(G.data.chargers.map(c=>c.모델분류).filter(Boolean))].sort();
  document.getElementById("charger-model-filter").innerHTML =
    `<option value="">전체 모델</option>`+
    models.map(m=>`<option value="${m}">${m}</option>`).join("");
}

function contractBadge(v) {
  const map = {"계약만료":"badge-red","만료임박":"badge-orange",
    "만료예정":"badge-yellow","정상운영":"badge-green","정보없음":"badge-gray"};
  const emoji = {"계약만료":"🔴","만료임박":"🟠","만료예정":"🟡","정상운영":"🟢","정보없음":"⚪"};
  return v?`<span class="badge ${map[v]||"badge-gray"}">${emoji[v]||""}${v}</span>`:"-";
}

// ═══════════════════════════════════════
// 사이트별 탭 전체 렌더링
// ═══════════════════════════════════════
function renderSitePage() {
  const uk  = usageKey();
  const uak = usageAvgKey();
  const cuk = chargerUK();
  const lbl = G.useRecent ? "최신1개월" : "전체기간";

  const sorted = [...G.site.filtered]
    .sort((a, b) => (b[uk] || 0) - (a[uk] || 0));

  const total = sorted.length;
  const start = (G.site.page - 1) * G.site.perPage;
  const page  = sorted.slice(start, start + G.site.perPage);

  document.getElementById("site-count-info").textContent =
    `총 ${fmt(total)}개 사이트`;

  // ── ① 사이트별 집계 테이블 ───────────────────────
  const siteTableRows = page.map(s => `
    <tr>
      <td><b>${s.대표사이트명 || s.충전소명 || "-"}</b></td>
      <td>${s.주소 || "-"}</td>
      <td><span class="badge badge-blue">${s.권역 || "-"}</span></td>
      <td style="text-align:right;">${fmt(s.충전기수)}대</td>
      <td style="text-align:right;">${fmtK(s[uk])}</td>
      <td style="text-align:right;">${fmtK(s[uak])}</td>
      <td style="text-align:right;">${fmtK(s.총누적사용량)}</td>
      <td>${contractBadge(s.계약상태)}</td>
    </tr>`).join("");

  document.getElementById("site-table-wrap").innerHTML = `
    <div class="table-wrap">
      <div class="table-header">
        <h3>🏢 사이트별 현황 [${lbl}]</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" onclick="downloadCSV('site')"
            style="font-size:.8rem;">💾 CSV</button>
          <span class="badge badge-blue">${fmt(total)}개 사이트</span>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>사이트명</th>
              <th>주소</th>
              <th>권역</th>
              <th style="text-align:right;">충전기수</th>
              <th style="text-align:right;">월합계(kWh)</th>
              <th style="text-align:right;">충전기당(kWh)</th>
              <th style="text-align:right;">총누적(kWh)</th>
              <th>계약상태</th>
            </tr>
          </thead>
          <tbody>${siteTableRows || `<tr><td colspan="8"
            style="text-align:center;padding:30px;color:var(--text2);">
            검색 결과 없음</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div id="site-pagination-area"></div>`;

  renderPagination("site2", total, G.site.page, G.site.perPage,
    p => { G.site.page = p; renderSitePage(); },
    "site-pagination-area");

  // ── ② 해당 사이트들의 충전기 목록 ────────────────
  const siteKeys = new Set(page.map(s => s.사이트키));
  const siteChargers = G.data.chargers
    .filter(c => siteKeys.has(c.사이트키))
    .sort((a, b) => (b[cuk] || 0) - (a[cuk] || 0));

  const chargerRows = siteChargers.map(c => `
    <tr>
      <td>${c.충전기ID || "-"}</td>
      <td>${c.충전소명 || "-"}</td>
      <td>${c.상세주소 || "-"}</td>
      <td><span class="badge badge-blue">${c.모델분류 || "-"}</span></td>
      <td>${c.충전기유형 || "-"}</td>
      <td style="text-align:right;">${fmtK(c.월사용량_전체)}</td>
      <td style="text-align:right;">${fmtK(c.월사용량_최신)}</td>
      <td style="text-align:right;">${fmtK(c.누적사용량_daily)}</td>
      <td>${contractBadge(c.계약상태)}</td>
      <td style="color:var(--text2);">${c.운영계약종료 || "-"}</td>
    </tr>`).join("");

  document.getElementById("site-charger-wrap").innerHTML = `
    <div class="table-wrap">
      <div class="table-header">
        <h3>🔌 충전기별 현황 [${lbl}]</h3>
        <span class="badge badge-blue">${fmt(siteChargers.length)}대</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>충전기ID</th>
              <th>충전소명</th>
              <th>상세주소</th>
              <th>모델</th>
              <th>유형</th>
              <th style="text-align:right;">월평균(전체)</th>
              <th style="text-align:right;">월평균(최신)</th>
              <th style="text-align:right;">누적(kWh)</th>
              <th>계약상태</th>
              <th>계약종료일</th>
            </tr>
          </thead>
          <tbody>${chargerRows || `<tr><td colspan="10"
            style="text-align:center;padding:20px;color:var(--text2);">
            데이터 없음</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  // ── ③ 계약 현황 카드 ─────────────────────────────
  const contractCards = page.map(s => {
    const borderColor = {
      "계약만료":"var(--red)", "만료임박":"var(--orange)",
      "만료예정":"var(--yellow)", "정상운영":"var(--green)",
      "정보없음":"var(--gray)"
    }[s.계약상태] || "var(--gray)";

    const remText = s.잔여일수 != null && s.잔여일수 > -9000
      ? (s.잔여일수 < 0
          ? `만료 ${Math.abs(s.잔여일수)}일 경과`
          : `잔여 ${fmt(s.잔여일수)}일`)
      : "-";

    // 계약 진행률
    let progress = 0;
    if (s.운영계약시작 && s.운영계약종료) {
      const start = new Date(s.운영계약시작).getTime();
      const end   = new Date(s.운영계약종료).getTime();
      const now   = Date.now();
      progress = Math.min(100, Math.max(0,
        Math.round((now - start) / (end - start) * 100)
      ));
    }

    return `
    <div style="background:var(--card);border-radius:var(--radius);
      border-left:4px solid ${borderColor};padding:16px;
      box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;
        align-items:flex-start;margin-bottom:8px;">
        <div style="font-weight:700;font-size:.95rem;">
          🏢 ${s.대표사이트명 || s.충전소명 || "-"}
        </div>
        ${contractBadge(s.계약상태)}
      </div>
      <div style="font-size:.78rem;color:var(--text2);margin-bottom:8px;">
        📍 ${s.주소 || "-"}
      </div>
      <div style="display:flex;gap:12px;font-size:.82rem;margin-bottom:8px;flex-wrap:wrap;">
        <span>🔌 <b>${fmt(s.충전기수)}대</b></span>
        <span>⚡ <b>${fmtK(s[uk])} kWh/월</b></span>
        <span style="color:${borderColor};font-weight:700;">⏳ ${remText}</span>
      </div>
      <div style="font-size:.78rem;color:var(--text2);margin-bottom:8px;">
        📅 ${s.운영계약시작 || "-"} ~ ${s.운영계약종료 || "-"}
      </div>
      <div style="background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden;">
        <div style="background:${borderColor};height:100%;
          width:${progress}%;transition:width .3s;border-radius:6px;"></div>
      </div>
      <div style="font-size:.72rem;color:var(--text2);margin-top:4px;text-align:right;">
        계약 진행률 ${progress}%
      </div>
    </div>`;
  }).join("");

  document.getElementById("site-contract-wrap").innerHTML = `
    <div style="background:var(--card);border-radius:var(--radius);
      padding:16px;box-shadow:var(--shadow);margin-bottom:20px;">
      <h3 style="font-size:.95rem;font-weight:700;margin-bottom:14px;">
        📅 계약 현황
      </h3>
      <div style="display:grid;
        grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">
        ${contractCards || `<div style="color:var(--text2);padding:20px;">
          데이터 없음</div>`}
      </div>
    </div>`;
}

const CHARGER_COLS = [

  { key:"충전기유형",      label:"유형",          fmt:v=>v||"-" },
  { key:"월사용량_전체",   label:"월평균(전체)",  fmt:v=>fmtK(v) },

];

function renderChargerTable() {
  const uk = chargerUK();
  const sorted = [...G.charger.filtered]
    .sort((a,b)=>{
      const va=a[G.charger.sortCol]||0, vb=b[G.charger.sortCol]||0;
      return typeof va==="number"?(vb-va)*G.charger.sortDir
        :String(va).localeCompare(String(vb))*G.charger.sortDir;
    });

  document.getElementById("charger-thead").innerHTML =
    CHARGER_COLS.map(c=>
      `<th onclick="sortCharger('${c.key}')">${c.label}</th>`
    ).join("");

  const total = sorted.length;
  const start = (G.charger.page-1)*G.charger.perPage;
  const page  = sorted.slice(start, start+G.charger.perPage);

  document.getElementById("charger-tbody").innerHTML = page.map(row=>
    `<tr>${CHARGER_COLS.map(c=>`<td>${c.fmt(row[c.key])}</td>`).join("")}</tr>`
  ).join("") || `<tr><td colspan="${CHARGER_COLS.length}"
    style="text-align:center;padding:30px;color:var(--text2);">검색 결과 없음</td></tr>`;

  document.getElementById("charger-count-badge").textContent = `${fmt(total)}대`;
  renderPagination("charger", total, G.charger.page, G.charger.perPage,
    p=>{ G.charger.page=p; renderChargerTable(); });
}

function sortCharger(col) {
  if (G.charger.sortCol===col) G.charger.sortDir*=-1;
  else { G.charger.sortCol=col; G.charger.sortDir=-1; }
  G.charger.page=1; renderChargerTable();
}

function onChargerSearch() {
  const kw    = document.getElementById("charger-search").value.toLowerCase().trim();
  const model = document.getElementById("charger-model-filter").value;
  G.charger.filtered = G.data.chargers.filter(c=>{

    return (!kw||s.includes(kw)) && (!model||c.모델분류===model);
  });
  G.charger.page=1; renderChargerTable();
}

function clearChargerFilter() {
  document.getElementById("charger-search").value      ="";
  document.getElementById("charger-model-filter").value="";
  G.charger.filtered=[...G.data.chargers];
  G.charger.page=1; renderChargerTable();
}

// ═══════════════════════════════════════
// 차트
// ═══════════════════════════════════════
function destroyChart(id) {
  if (G.charts[id]) { G.charts[id].destroy(); delete G.charts[id]; }
}

function makeBarChart(id, labels, data, color="#1a73e8", horizontal=true) {
  destroyChart(id);
  const ctx = document.getElementById(id)?.getContext("2d");
  if (!ctx) return;
  G.charts[id] = new Chart(ctx, {
    type:"bar",
    data:{ labels, datasets:[{ data, backgroundColor:color+"cc",
      borderColor:color, borderWidth:1, borderRadius:4 }] },
    options:{ indexAxis:horizontal?"y":"x", responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false}, datalabels:{display:false} },
      scales:{ x:{grid:{display:false}}, y:{grid:{display:!horizontal}} } }
  });
}

function makePieChart(id, labels, data) {
  destroyChart(id);
  const ctx = document.getElementById(id)?.getContext("2d");
  if (!ctx) return;
  const COLORS=["#1a73e8","#34a853","#fbbc04","#ea4335","#9c27b0",
    "#00bcd4","#ff5722","#607d8b","#795548","#e91e63","#3f51b5","#009688"];
  G.charts[id] = new Chart(ctx, {
    type:"doughnut",
    data:{ labels, datasets:[{ data, backgroundColor:COLORS.slice(0,labels.length),
      borderWidth:2, borderColor:"#fff" }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:"right",labels:{font:{size:10},boxWidth:12}},
        datalabels:{display:false} }, cutout:"40%" }
  });
}

function renderCharts() {
  const uk  = usageKey();
  const lbl = G.useRecent?"최신1개월 (kWh/월)":"전체기간 월평균 (kWh/월)";

  const models = [...G.data.models].sort((a,b)=>b.충전기수-a.충전기수).slice(0,15);
  makeBarChart("chart-model-count", models.map(m=>m.모델분류), models.map(m=>m.충전기수),"#1a73e8");

  const regions = sortRegions(G.data.regions);
  makePieChart("chart-region-count", regions.map(r=>r.권역), regions.map(r=>r.충전기수));

  document.getElementById("chart-model-usage-title").textContent=`📈 모델별 ${lbl} 합계 (상위 15)`;
  const mu=[...G.data.models].sort((a,b)=>(b[uk]||0)-(a[uk]||0)).slice(0,15);
  makeBarChart("chart-model-usage", mu.map(m=>m.모델분류), mu.map(m=>m[uk]||0),"#34a853");

  document.getElementById("chart-region-usage-title").textContent=`🗺️ 권역별 ${lbl} 합계`;
  makeBarChart("chart-region-usage",
    regions.map(r=>r.권역), regions.map(r=>r[uk]||0),"#fbbc04", false);
}

function sortRegions(arr) {
  return [...arr].sort((a,b)=>{
    const ia=REGION_ORDER.indexOf(a.권역), ib=REGION_ORDER.indexOf(b.권역);
    return (ia===-1?99:ia)-(ib===-1?99:ib);
  });
}

// ═══════════════════════════════════════
// 히트맵
// ═══════════════════════════════════════
function buildHeatmap() {
  const chargers = G.data.chargers;
  const uk = G.useRecent?"월사용량_최신":"월사용량_전체";

  const modelCounts={};
  chargers.forEach(c=>{ if(c.모델분류) modelCounts[c.모델분류]=(modelCounts[c.모델분류]||0)+1; });
  const topModels=Object.entries(modelCounts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(e=>e[0]);

  const existingRegions=REGION_ORDER.filter(r=>chargers.some(c=>c.권역===r));
  const pivot={};
  chargers.forEach(c=>{
    const m=c.모델분류, r=c.권역;
    if(!m||!r||!topModels.includes(m)) return;
    if(!pivot[m]) pivot[m]={};
    pivot[m][r]=(pivot[m][r]||0)+(c[uk]||0);
  });

  const allVals=[];
  topModels.forEach(m=>existingRegions.forEach(r=>{ if(pivot[m]?.[r]) allVals.push(pivot[m][r]); }));
  const maxVal=allVals.length?Math.max(...allVals):1;

  function cellColor(v) {
    if(!v) return "#f8fafc";
    const t=v/maxVal;
    return `rgb(${Math.round(234-(234-26)*t)},${Math.round(248-(248-115)*t)},${Math.round(252-(252-232)*t)})`;
  }
  function textColor(v) { return v/maxVal>0.5?"#fff":"#1e293b"; }

  const lbl=G.useRecent?"최신1개월":"전체기간";
  document.getElementById("heatmap-title").textContent=`🔥 권역 × 모델 사용량 히트맵 [${lbl}] (kWh/월)`;

  let html=`<table class="heatmap-table"><thead><tr>
    <th>모델</th>${existingRegions.map(r=>`<th>${r}</th>`).join("")}<th>합계</th>
  </tr></thead><tbody>`;

  topModels.forEach(m=>{
    let rowSum=0;
    const cells=existingRegions.map(r=>{
      const v=pivot[m]?.[r]||0; rowSum+=v;
      return `<td style="background:${cellColor(v)};color:${textColor(v)};">${v?fmtK(v):"·"}</td>`;
    });
    html+=`<tr><td style="text-align:left;font-weight:600;">${m}</td>${cells.join("")}
      <td style="font-weight:700;">${fmtK(rowSum)}</td></tr>`;
  });

  const colSums=existingRegions.map(r=>topModels.reduce((s,m)=>s+(pivot[m]?.[r]||0),0));
  html+=`<tr style="background:#f0f6ff;font-weight:700;"><td>합계</td>
    ${colSums.map(v=>`<td>${fmtK(v)}</td>`).join("")}
    <td>${fmtK(colSums.reduce((s,v)=>s+v,0))}</td>
  </tr></tbody></table>`;

  document.getElementById("heatmap-container").innerHTML=html;
}

// ═══════════════════════════════════════
// 페이지네이션
// ═══════════════════════════════════════
function renderPagination(id, total, current, perPage, callback, containerId) {
  const totalPages = Math.ceil(total / perPage);
  const elId = containerId || `${id}-pagination`;  // ← 이 줄 추가
  const el   = document.getElementById(elId);       // ← id → elId 로 변경
  if(!el||totalPages<=1){ if(el) el.innerHTML=""; return; }

  const pages=[1];
  for(let i=Math.max(2,current-2);i<=Math.min(totalPages-1,current+2);i++) pages.push(i);
  if(totalPages>1) pages.push(totalPages);
  const dedup=[...new Set(pages)];

  let html=`<span style="font-size:.8rem;color:var(--text2);margin-right:8px;">${fmt(total)}개 / ${totalPages}페이지</span>`;
  let prev=0;
  html+=dedup.map(p=>{
    let gap=prev>0&&p-prev>1?`<span style="padding:0 4px;">…</span>`:"";
    prev=p;
    return `${gap}<button class="page-btn ${p===current?"active":""}"
      onclick="(${callback.toString()})(${p})">${p}</button>`;
  }).join("");
  el.innerHTML=html;
}

// ═══════════════════════════════════════
// CSV 다운로드
// ═══════════════════════════════════════
function downloadCSV(type) {
  const dataMap={
    charger:{ data:G.charger.filtered, cols:CHARGER_COLS },
    site:   { data:G.site.filtered,    cols:null },
    model:  { data:G.data.models,      cols:null },
    region: { data:G.data.regions,     cols:null },
  };
  const {data,cols}=dataMap[type]||{};
  if(!data) return;
  const keys  = cols?cols.map(c=>c.key):Object.keys(data[0]||{});
  const labels= cols?cols.map(c=>c.label):keys;
  let csv="\uFEFF"+labels.join(",")+"\n";
  data.forEach(row=>{
    csv+=keys.map(k=>{
      let v=row[k]; if(v==null) return "";
      v=String(v).replace(/<[^>]+>/g,"").replace(/,/g,"，");
      return `"${v}"`;
    }).join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`ev_${type}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function switchTab(id,btn) {
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}
